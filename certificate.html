 <!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALIMDAR — Potvrda</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #062219;
  font-family: Arial, Helvetica, sans-serif;
  color: #173f32;
}

/* =====================================================
   GORNJA TRAKA
===================================================== */

.toolbar {
  width: 1123px;
  max-width: calc(100% - 30px);
  margin: 18px auto;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.toolbar-title {
  color: #d8b85c;
  font-weight: bold;
  letter-spacing: 2px;
}

.print-button {
  border: 0;
  background: #d8b85c;
  color: #102018;

  padding: 12px 20px;

  font-weight: bold;
  cursor: pointer;
}

.print-button:hover {
  opacity: 0.9;
}

/* =====================================================
   PORUKA
===================================================== */

.message {
  width: 1123px;
  max-width: calc(100% - 30px);

  margin: 30px auto;
  padding: 20px;

  color: white;
  background: #09241b;
  border: 1px solid #365448;
}

/* =====================================================
   CERTIFIKAT
===================================================== */

.certificate {
  position: relative;

  width: 1123px;
  height: 794px;

  margin: 0 auto 40px;

  overflow: hidden;

  background: #f5ecd8;

  box-shadow:
    0 15px 45px rgba(0, 0, 0, 0.35);
}

/* =====================================================
   POZADINSKA SLIKA
===================================================== */

.background {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 0;
}

/* =====================================================
   GLAVNI PROMJENJIVI PODACI
===================================================== */

.dynamic {
  position: absolute;

  z-index: 2;

  top: 300px;
  left: 220px;
  right: 220px;

  text-align: center;
}

/* IME POLAZNIKA */

.name {
  font-family: Georgia, "Times New Roman", serif;

  font-size: 31px;
  line-height: 1.15;

  font-weight: bold;

  color: #43205a;

  margin-bottom: 15px;
}

/* UVODNI TEKST */

.intro {
  max-width: 720px;

  margin: 0 auto 14px;

  font-size: 12px;
  line-height: 1.4;

  color: #303a34;
}

/* PODRUČJE */

.area {
  max-width: 760px;

  margin: 0 auto 8px;

  font-size: 16px;
  line-height: 1.3;

  font-weight: bold;

  color: #173f32;
}

/* TEMA */

.topic {
  max-width: 760px;

  margin: 0 auto;

  font-size: 10px;
  line-height: 1.35;

  color: #343b37;
}

/* =====================================================
   TRI PODATKA U SREDINI
===================================================== */

.details {
  position: absolute;

  z-index: 2;

  top: 505px;
  left: 230px;
  right: 230px;

  display: grid;

  grid-template-columns: 1fr 1fr 1fr;

  gap: 24px;

  text-align: center;
}

.detail-value {
  font-size: 11px;
  line-height: 1.3;

  font-weight: bold;

  color: #173f32;
}

/* =====================================================
   DONJI DIO
===================================================== */

.footer-data {
  position: absolute;

  z-index: 2;

  left: 200px;
  right: 200px;

  bottom: 65px;

  display: grid;

  grid-template-columns: 1fr 120px 1fr;

  gap: 30px;

  align-items: end;
}

/* DATUM + ID */

.issue {
  font-size: 10px;
  line-height: 1.6;

  color: #173f32;
}

.issue strong {
  font-weight: bold;
}

/* =====================================================
   QR
===================================================== */

.qr-box {
  text-align: center;
}

.qr-image {
  display: block;

  width: 92px;
  height: 92px;

  margin: 0 auto;

  padding: 4px;

  background: white;

  border: 1px solid #b59643;
}

.qr-label {
  margin-top: 5px;

  font-size: 7px;

  color: #624d18;

  font-weight: bold;

  text-transform: uppercase;

  letter-spacing: 0.7px;
}

/* =====================================================
   IZDAVATELJ
===================================================== */

.issuer {
  text-align: right;

  font-size: 10px;
  line-height: 1.4;

  color: #173f32;
}

.issuer strong {
  display: block;

  font-size: 11px;
}

/* =====================================================
   STATUS
===================================================== */

.watermark {
  position: absolute;

  z-index: 4;

  top: 52%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-25deg);

  font-size: 72px;

  font-weight: bold;

  letter-spacing: 10px;

  color: rgba(100, 70, 20, 0.10);

  pointer-events: none;
}

/* =====================================================
   RESPONSIVE
===================================================== */

.certificate-wrapper {
  overflow-x: auto;
  padding-bottom: 20px;
}

/* =====================================================
   PRINT
===================================================== */

@page {
  size: A4 landscape;
  margin: 0;
}

@media print {

  body {
    background: white;
  }

  .toolbar,
  .message {
    display: none !important;
  }

  .certificate-wrapper {
    overflow: visible;
    padding: 0;
  }

  .certificate {
    width: 297mm;
    height: 210mm;

    margin: 0;

    box-shadow: none;
  }
}
</style>
</head>

<body>

<!-- ===================================================
     ALATNA TRAKA
=================================================== -->

<div class="toolbar">

  <div class="toolbar-title">
    ALIMDAR TECHNOLOGY — CERTIFICATE
  </div>

  <button
    id="printButton"
    class="print-button"
    style="display:none;"
  >
    Ispiši / Spremi kao PDF
  </button>

</div>


<!-- ===================================================
     PORUKA
=================================================== -->

<div
  id="message"
  class="message"
>
  Učitavanje potvrde...
</div>


<div class="certificate-wrapper">

<div
  id="certificate"
  class="certificate"
  style="display:none;"
>

  <!-- NOVA ČISTA POZADINA -->

  <img
    class="background"
    src="/certificate-background.png"
    alt="ALIMDAR potvrda"
  >


  <!-- STATUS -->

  <div
    id="watermark"
    class="watermark"
    style="display:none;"
  >
    PENDING
  </div>


  <!-- =================================================
       IME + SADRŽAJ
  ================================================== -->

  <div class="dynamic">

    <div
      id="participantName"
      class="name"
    ></div>


    <div class="intro">
      Ovom se potvrdom evidentira sudjelovanje navedene osobe
      u stručnom savjetovanju koje je proveo
      <strong>Uslužni obrt Alimdar</strong>.
    </div>


    <div
      id="area"
      class="area"
    ></div>


    <div
      id="topic"
      class="topic"
    ></div>

  </div>


  <!-- =================================================
       RAZDOBLJE / SATI / NAČIN
  ================================================== -->

  <div class="details">

    <div>
      <div
        id="period"
        class="detail-value"
      ></div>
    </div>


    <div>
      <div
        id="totalHours"
        class="detail-value"
      ></div>
    </div>


    <div>
      <div
        id="workFormat"
        class="detail-value"
      ></div>
    </div>

  </div>


  <!-- =================================================
       DONJI PODACI
  ================================================== -->

  <div class="footer-data">

    <div class="issue">

      <div>
        Datum izdavanja:
        <strong id="issueDate"></strong>
      </div>

      <div>
        Certificate ID:
        <strong id="certificateId"></strong>
      </div>

    </div>


    <!-- QR -->

    <div class="qr-box">

      <img
        id="qrImage"
        class="qr-image"
        alt="QR provjera autentičnosti"
      >

      <div class="qr-label">
        Provjera autentičnosti
      </div>

    </div>


    <!-- IZDAVATELJ -->

    <div class="issuer">

      Izdavatelj

      <strong>
        Uslužni obrt Alimdar
      </strong>

      Rijeka, Hrvatska

    </div>

  </div>

</div>

</div>


<script>

/* =====================================================
   ELEMENTI
===================================================== */

const message =
  document.getElementById("message");

const certificate =
  document.getElementById("certificate");

const watermark =
  document.getElementById("watermark");

const printButton =
  document.getElementById("printButton");


/* =====================================================
   POMOĆNA FUNKCIJA
===================================================== */

function displayValue(
  value,
  fallback = "Nije evidentirano"
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return fallback;
  }

  return String(value);
}


/* =====================================================
   UČITAVANJE POTVRDE
===================================================== */

async function loadCertificate() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    String(
      params.get("id") || ""
    )
    .trim()
    .toUpperCase();


  /* PROVJERA ID-a */

  if (
    !/^ALM-CON-\d{4}-\d{4,}$/.test(id)
  ) {

    message.textContent =
      "Neispravan Certificate ID.";

    return;
  }


  try {

    /* ===============================================
       PODACI IZ ALIMDAR API-ja
    =============================================== */

    const response =
      await fetch(
        `/api/certificates?id=${encodeURIComponent(id)}`,
        {
          headers: {
            "Accept": "application/json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Certificate API error"
      );
    }


    const c =
      await response.json();


    /* ===============================================
       IME
    =============================================== */

    document.getElementById(
      "participantName"
    ).textContent =
      displayValue(
        c.participantName,
        ""
      );


    /* ===============================================
       PODRUČJE
    =============================================== */

    document.getElementById(
      "area"
    ).textContent =
      displayValue(
        c.area,
        ""
      );


    /* ===============================================
       TEMA
    =============================================== */

    document.getElementById(
      "topic"
    ).textContent =
      c.topic
        ? "Tema savjetovanja: " + c.topic
        : "";


    /* ===============================================
       RAZDOBLJE
    =============================================== */

    document.getElementById(
      "period"
    ).textContent =
      displayValue(c.date);


    /* ===============================================
       UKUPAN FOND SATI
    =============================================== */

    document.getElementById(
      "totalHours"
    ).textContent =

      c.totalHours !== null &&
      c.totalHours !== undefined &&
      c.totalHours !== ""

      ? `${c.totalHours} sati`

      : "Nije još evidentirano";


    /* ===============================================
       NAČIN ODRŽAVANJA
    =============================================== */

    document.getElementById(
      "workFormat"
    ).textContent =
      displayValue(c.format);


    /* ===============================================
       DATUM IZDAVANJA
    =============================================== */

    document.getElementById(
      "issueDate"
    ).textContent =
      displayValue(
        c.issueDate,
        "Nije još izdano"
      );


    /* ===============================================
       CERTIFICATE ID
    =============================================== */

    document.getElementById(
      "certificateId"
    ).textContent =
      displayValue(
        c.certificateId,
        id
      );


    /* ===============================================
       QR

       QR NE SADRŽI OSOBNE PODATKE.
       SADRŽI SAMO JAVNU VERIFICATION ADRESU.
    =============================================== */

    const verificationUrl =
      `${window.location.origin}/?id=${encodeURIComponent(c.certificateId)}`;


    const qrImage =
      document.getElementById("qrImage");


    qrImage.src =
      "https://api.qrserver.com/v1/create-qr-code/" +
      "?size=220x220" +
      "&margin=8" +
      "&data=" +
      encodeURIComponent(
        verificationUrl
      );


    /* ===============================================
       STATUS
    =============================================== */

    const status =
      String(
        c.status || "PENDING"
      )
      .trim()
      .toUpperCase();


    if (status === "VALID") {

      watermark.style.display =
        "none";

      printButton.style.display =
        "block";

    }

    else if (status === "REVOKED") {

      watermark.textContent =
        "REVOKED";

      watermark.style.display =
        "block";

      printButton.style.display =
        "none";

    }

    else {

      watermark.textContent =
        "PENDING";

      watermark.style.display =
        "block";

      /*
        Za sada PENDING ne printamo
        kao završnu izdanu potvrdu.
      */

      printButton.style.display =
        "none";
    }


    /* ===============================================
       PRIKAŽI
    =============================================== */

    message.style.display =
      "none";

    certificate.style.display =
      "block";

  }

  catch (error) {

    console.error(
      "ALIMDAR certificate error:",
      error
    );

    message.textContent =
      "Potvrdu trenutačno nije moguće učitati.";
  }
}


/* =====================================================
   PRINT
===================================================== */

printButton.addEventListener(
  "click",
  () => {
    window.print();
  }
);


/* =====================================================
   START
===================================================== */

loadCertificate();

</script>

</body>
</html>
