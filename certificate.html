 <!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALIMDAR — Certifikat</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #062a21;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 18px;
}

.page-title {
    width: min(100%, 1536px);
    margin: 0 auto 14px;
    color: #e2b84f;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
}

/* =========================================================
   CERTIFIKAT
   Slika određuje cijeli koordinatni sustav.
   ========================================================= */

.certificate {
    position: relative;
    width: min(100%, 1536px);
    aspect-ratio: 1536 / 832;
    margin: 0 auto;

    background:
        url("./certificate-background.png")
        center center / 100% 100%
        no-repeat;

    overflow: hidden;
}

/* =========================================================
   ZAJEDNIČKO
   ========================================================= */

.field {
    position: absolute;
    margin: 0;
    text-align: center;
    color: #111;
}

/* =========================================================
   IME
   ========================================================= */

#participantName {
    top: 40.6%;
    left: 25%;
    width: 50%;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 2.5vw, 40px);
    line-height: 1;
    font-weight: 700;
    color: #45145c;
}

/* =========================================================
   OPIS ISPOD IMENA
   ========================================================= */

#statement {
    top: 46.8%;
    left: 26%;
    width: 48%;

    font-size: clamp(7px, 0.72vw, 11px);
    line-height: 1.25;
}

/* =========================================================
   PODRUČJE
   ========================================================= */

#area {
    top: 51.4%;
    left: 24%;
    width: 52%;

    font-size: clamp(10px, 1.08vw, 17px);
    line-height: 1.15;
    font-weight: 700;
    color: #07372d;
}

/* =========================================================
   TEMA

   Držimo je VISOKO iznad tri naslova koja su već nacrtana
   na certificate-background.png.
   ========================================================= */

#topic {
    top: 56.1%;
    left: 27%;
    width: 46%;

    font-size: clamp(6px, 0.54vw, 9px);
    line-height: 1.25;
    color: #222;
}

/* =========================================================
   TRI VRIJEDNOSTI

   Naslovi:
   RAZDOBLJE SAVJETOVANJA
   UKUPAN FOND SATI
   NAČIN ODRŽAVANJA

   već postoje NA SLICI.
   Ovdje ispisujemo samo vrijednosti ispod crta.
   ========================================================= */

#period {
    top: 68.0%;
    left: 19%;
    width: 19%;

    font-size: clamp(7px, 0.72vw, 11px);
    font-weight: 700;
}

#totalHours {
    top: 68.0%;
    left: 41%;
    width: 18%;

    font-size: clamp(7px, 0.72vw, 11px);
    font-weight: 700;
}

#workFormat {
    top: 68.0%;
    left: 62%;
    width: 19%;

    font-size: clamp(7px, 0.72vw, 11px);
    font-weight: 700;
}

/* =========================================================
   QR

   Bijeli kvadrat je već nacrtan na pozadini.
   QR stavljamo UNUTAR njega.
   ========================================================= */

#qr {
    position: absolute;

    left: 50%;
    top: 83.4%;

    width: 6.7%;
    aspect-ratio: 1 / 1;

    transform: translate(-50%, -50%);

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff;
    padding: 3px;
}

#qr img,
#qr canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
}

/* =========================================================
   DONJI LIJEVI PODACI

   "Datum izdavanja:" i "Certificate ID:"
   već postoje na slici.
   HTML dodaje SAMO vrijednosti.
   ========================================================= */

#issueDate {
    left: 26.2%;
    bottom: 6.8%;
    width: 12%;

    text-align: left;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(6px, 0.62vw, 10px);
    font-weight: 700;
}

#certificateId {
    left: 26.2%;
    bottom: 3.8%;
    width: 16%;

    text-align: left;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(6px, 0.58vw, 9px);
    font-weight: 700;
}

/* =========================================================
   STATUS
   ========================================================= */

#status {
    position: absolute;

    right: 12.5%;
    bottom: 2.4%;

    padding: 4px 9px;

    border: 1px solid #9b7416;
    border-radius: 3px;

    background: #e4ba48;
    color: #191609;

    font-size: clamp(6px, 0.62vw, 10px);
    font-weight: 700;
    letter-spacing: 1px;
}

#status.valid {
    background: #145c42;
    color: white;
}

#status.revoked {
    background: #8c2929;
    color: white;
}

/* =========================================================
   GREŠKA
   ========================================================= */

#error {
    display: none;

    max-width: 800px;
    margin: 30px auto;

    padding: 25px;

    background: #fff4d6;
    border: 1px solid #c99a32;

    text-align: center;
    color: #33220c;
}

/* =========================================================
   A4 LANDSCAPE

   A4 NE MIJENJA unutarnji raspored.
   Cijeli gotov certifikat skalira se kao jedna cjelina.
   ========================================================= */

@page {
    size: A4 landscape;
    margin: 0;
}

@media print {

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        width: 297mm;
        height: 210mm;
        background: white !important;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .page-title {
        display: none !important;
    }

    .certificate {
        width: 297mm !important;
        margin: 0 auto !important;

        page-break-inside: avoid;
        break-inside: avoid;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
}
</style>
</head>

<body>

<div class="page-title">
    ALIMDAR TECHNOLOGY — CERTIFICATE
</div>

<main id="certificate" class="certificate">

    <div id="participantName" class="field"></div>

    <div id="statement" class="field">
        Ovim se certifikatom evidentira sudjelovanje navedene osobe
        u stručnom savjetovanju koje je proveo
        <strong>Uslužni obrt Alimdar.</strong>
    </div>

    <div id="area" class="field"></div>

    <div id="topic" class="field"></div>

    <div id="period" class="field"></div>

    <div id="totalHours" class="field"></div>

    <div id="workFormat" class="field"></div>

    <div id="qr"></div>

    <div id="issueDate" class="field"></div>

    <div id="certificateId" class="field"></div>

    <div id="status">PENDING</div>

</main>

<div id="error">
    Certifikat trenutačno nije moguće učitati.
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const requestedId =
    String(params.get("id") || "")
    .trim()
    .toUpperCase();

const certificateElement =
    document.getElementById("certificate");

const errorElement =
    document.getElementById("error");


function setText(id, value, fallback = "") {

    const element =
        document.getElementById(id);

    if (!element) return;

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        element.textContent = fallback;
        return;
    }

    element.textContent = String(value);
}


function setStatus(value) {

    const statusElement =
        document.getElementById("status");

    const status =
        String(value || "PENDING")
        .trim()
        .toUpperCase();

    statusElement.className = "";

    if (status === "VALID") {
        statusElement.classList.add("valid");
        statusElement.textContent = "VALID";
        return;
    }

    if (status === "REVOKED") {
        statusElement.classList.add("revoked");
        statusElement.textContent = "REVOKED";
        return;
    }

    statusElement.textContent = "PENDING";
}


function createQR(id) {

    const container =
        document.getElementById("qr");

    container.innerHTML = "";

    const verificationURL =
        `${window.location.origin}/?id=${encodeURIComponent(id)}`;

    if (typeof QRCode === "undefined") {
        container.textContent = "QR";
        return;
    }

    new QRCode(container, {
        text: verificationURL,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.H
    });
}


async function loadCertificate() {

    if (
        !/^ALM-CON-\d{4}-\d{4,}$/.test(requestedId)
    ) {

        certificateElement.style.display = "none";
        errorElement.style.display = "block";
        errorElement.textContent =
            "Certificate ID nije ispravan.";

        return;
    }

    try {

        const response =
            await fetch(
                `/api/certificates?id=${encodeURIComponent(requestedId)}`,
                {
                    cache: "no-store",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

        if (!response.ok) {
            throw new Error(
                `API error ${response.status}`
            );
        }

        const c =
            await response.json();


        /* IME */

        setText(
            "participantName",
            c.participantName,
            "Nije evidentirano"
        );


        /* PODRUČJE */

        setText(
            "area",
            c.area,
            "Nije evidentirano"
        );


        /* TEMA */

        setText(
            "topic",
            c.topic
                ? `Tema savjetovanja: ${c.topic}`
                : ""
        );


        /* RAZDOBLJE */

        setText(
            "period",
            c.date,
            "Nije još evidentirano"
        );


        /*
           UKUPAN FOND SATI

           Ovdje namjerno NE stavljamo dugi "duration"
           tekst u malo polje.

           Dok stvarni ukupni broj sati nije evidentiran,
           prikazujemo samo kratku poruku.
        */

        if (
            c.totalHours !== null &&
            c.totalHours !== undefined &&
            c.totalHours !== ""
        ) {

            setText(
                "totalHours",
                `${c.totalHours} sati`
            );

        } else {

            setText(
                "totalHours",
                "Nije još evidentirano"
            );
        }


        /* NAČIN ODRŽAVANJA */

        setText(
            "workFormat",
            c.format,
            "Nije evidentirano"
        );


        /* STATUS */

        setStatus(c.status);


        /*
           DATUM IZDAVANJA

           PENDING certifikat još nije izdan.
        */

        const status =
            String(c.status || "PENDING")
            .toUpperCase();

        if (
            status === "VALID" &&
            c.issueDate
        ) {

            setText(
                "issueDate",
                c.issueDate
            );

        } else {

            setText(
                "issueDate",
                "Nije još izdano"
            );
        }


        /* CERTIFICATE ID */

        const actualId =
            c.certificateId || requestedId;

        setText(
            "certificateId",
            actualId
        );


        /* QR */

        createQR(actualId);


        document.title =
            `ALIMDAR — ${actualId}`;

    }

    catch (error) {

        console.error(
            "ALIMDAR certificate error:",
            error
        );

        certificateElement.style.display =
            "none";

        errorElement.style.display =
            "block";

        errorElement.textContent =
            "Certifikat trenutačno nije moguće učitati.";
    }
}


loadCertificate();

</script>

</body>
</html>
