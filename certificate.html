<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALIMDAR — Certifikat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #022c22;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 20px;
    }

    .page-title {
      width: min(100%, 1536px);
      margin: 0 auto 14px auto;

      color: #e7bd55;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /*
      VAŽNO:
      Ovo je naš jedini koordinatni sustav.

      Pozadina i SVI podaci nalaze se u istom elementu.
      Sve pozicije ispod izražene su u POSTOCIMA.

      Zato se kod smanjivanja/povećavanja cijeli certifikat
      ponaša kao jedna cjelina.
    */

    #certificate {
      position: relative;

      width: min(100%, 1536px);

      /*
        Omjer tvoje originalne slike:
        1536 × 832
      */
      aspect-ratio: 1536 / 832;

      margin: 0 auto;

      background-image: url("./certificate-background.png.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;

      overflow: hidden;
    }

    /*
      ZAJEDNIČKA PRAVILA
    */

    .field {
      position: absolute;
      margin: 0;
      text-align: center;
      color: #10281f;
      line-height: 1.15;
    }

    /*
      IME I PREZIME
      — velika prazna crta ispod naslova CERTIFIKAT
    */

    #participantName {
      left: 25%;
      top: 41.0%;
      width: 50%;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 2.5vw, 40px);
      font-weight: 700;
      color: #47145e;
    }

    /*
      REČENICA ISPOD IMENA
    */

    #statement {
      left: 23%;
      top: 47.2%;
      width: 54%;

      font-size: clamp(7px, 0.76vw, 12px);
      color: #111;
    }

    /*
      PODRUČJE SAVJETOVANJA
    */

    #area {
      left: 23%;
      top: 51.3%;
      width: 54%;

      font-size: clamp(11px, 1.15vw, 18px);
      font-weight: 700;
      color: #06372b;
    }

    /*
      TEMA SAVJETOVANJA

      Ima vlastiti prostor i više se NE SMIJE
      sudarati s tri naslova ispod.
    */

    #topic {
      left: 25%;
      top: 55.4%;
      width: 50%;

      font-size: clamp(6px, 0.62vw, 10px);
      line-height: 1.25;
      color: #191919;
    }

    /*
      TRI POLJA

      Naslovi RAZDOBLJE / UKUPAN FOND / NAČIN
      već postoje na samoj pozadinskoj slici.

      Zato HTML ovdje ispisuje SAMO VRIJEDNOSTI.
    */

    #period {
      left: 20%;
      top: 67.3%;
      width: 18%;
      font-size: clamp(8px, 0.78vw, 12px);
      font-weight: 700;
    }

    #totalHours {
      left: 41%;
      top: 67.3%;
      width: 18%;
      font-size: clamp(8px, 0.78vw, 12px);
      font-weight: 700;
    }

    #workFormat {
      left: 62%;
      top: 67.3%;
      width: 18%;
      font-size: clamp(8px, 0.78vw, 12px);
      font-weight: 700;
    }

    /*
      QR

      Bijeli okvir već postoji na slici.
      QR postavljamo UNUTAR njega.
    */

    #qr {
      position: absolute;

      left: 50%;
      top: 82.7%;

      width: 7.1%;
      aspect-ratio: 1 / 1;

      transform: translate(-50%, -50%);

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;
      padding: 4px;
    }

    #qr img,
    #qr canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /*
      DONJI LIJEVI PODACI

      Na pozadini već postoje:
      Datum izdavanja:
      Certificate ID:

      Zato HTML ispisuje samo njihove vrijednosti.
    */

    #issueDate {
      left: 26%;
      top: 93.2%;
      width: 11%;

      text-align: left;
      font-size: clamp(7px, 0.68vw, 11px);
      font-weight: 700;
      color: #111;
    }

    #certificateId {
      left: 26%;
      top: 96.0%;
      width: 15%;

      text-align: left;
      font-size: clamp(6px, 0.62vw, 10px);
      font-weight: 700;
      color: #111;
    }

    /*
      STATUS

      Ne stavljamo ga preko teksta izdavatelja.
    */

    #status {
      position: absolute;

      right: 11%;
      bottom: 3.5%;

      padding: 5px 10px;

      border: 1px solid #a57b13;
      border-radius: 3px;

      background: #e5bd4f;
      color: #172119;

      font-size: clamp(7px, 0.68vw, 11px);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /*
      PORUKA AKO API NE RADI
    */

    #error {
      display: none;

      width: min(100%, 900px);
      margin: 40px auto;

      padding: 25px;

      background: #fff4d6;
      border: 1px solid #d6aa3c;

      color: #3b2910;
      text-align: center;
      font-size: 18px;
    }

    /*
      ISPIS

      OVDJE — I SAMO OVDJE — UVODIMO A4.

      Browser cijeli već složeni certifikat tretira
      kao jednu cjelinu i smješta ga na A4 landscape.
    */

    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {

      html,
      body {
        width: 297mm;
        height: 210mm;

        margin: 0 !important;
        padding: 0 !important;

        background: white !important;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .page-title {
        display: none !important;
      }

      #error {
        display: none !important;
      }

      #certificate {
        width: 297mm;

        /*
          Ne određujemo zasebno visinu.
          aspect-ratio čuva isti raspored.
        */

        margin: 0 auto;

        page-break-inside: avoid;
        break-inside: avoid;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

  </style>
</head>


<body>

  <div class="page-title">
    ALIMDAR TECHNOLOGY — CERTIFICATE
  </div>


  <main id="certificate">

    <div id="participantName" class="field"></div>

    <div id="statement" class="field">
      Ovim se certifikatom evidentira sudjelovanje navedene osobe
      u stručnom savjetovanju koje je proveo
      <strong>Uslužni obrt Alimdar.</strong>
    </div>

    <div id="area" class="field"></div>

    <div id="topic" class="field"></div>

    <div id="period" class="field"></div>

    <div id="totalHours" class="field"></div>

    <div id="workFormat" class="field"></div>


    <div id="qr"></div>


    <div id="issueDate" class="field"></div>

    <div id="certificateId" class="field"></div>

    <div id="status"></div>

  </main>


  <div id="error">
    Certifikat trenutačno nije moguće učitati.
  </div>


  <!--
    QRCode biblioteka.
    QR se generira iz stvarnog URL-a javne provjere.
  -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>


  <script>

    /*
      --------------------------------------------------------
      ALIMDAR CERTIFICATE
      --------------------------------------------------------

      certificate.html?id=ALM-CON-2026-0001

      ID uzimamo iz URL-a.
    */

    const params = new URLSearchParams(window.location.search);

    const certificateId =
      String(params.get("id") || "")
        .trim()
        .toUpperCase();


    const certificate =
      document.getElementById("certificate");

    const errorBox =
      document.getElementById("error");


    /*
      Sigurno upisivanje teksta.
    */

    function setText(id, value, fallback = "") {

      const element = document.getElementById(id);

      if (!element) return;

      element.textContent =
        value === null ||
        value === undefined ||
        value === ""
          ? fallback
          : value;
    }


    /*
      --------------------------------------------------------
      UČITAVANJE PODATAKA IZ ALIMDAR API-ja
      --------------------------------------------------------
    */

    async function loadCertificate() {

      if (!certificateId) {

        certificate.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent =
          "Certificate ID nije naveden.";

        return;
      }


      try {

        const response =
          await fetch(
            `/api/certificates?id=${encodeURIComponent(certificateId)}`,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {
          throw new Error(
            `API error: ${response.status}`
          );
        }


        const c = await response.json();


        /*
          ----------------------------------------------------
          GLAVNI PODACI
          ----------------------------------------------------
        */

        setText(
          "participantName",
          c.participantName
        );


        setText(
          "area",
          c.area
        );


        /*
          Tema dobiva prefiks samo jednom.
        */

        setText(
          "topic",
          c.topic
            ? `Tema savjetovanja: ${c.topic}`
            : ""
        );


        setText(
          "period",
          c.date,
          "Nije još evidentirano"
        );


        /*
          API trenutačno vraća duration.
          Ako jednog dana uvedemo totalHours,
          ovaj kod prihvaća i njega.
        */

        setText(
          "totalHours",
          c.totalHours || c.duration,
          "Nije još evidentirano"
        );


        setText(
          "workFormat",
          c.format,
          "Nije još evidentirano"
        );


        setText(
          "issueDate",
          c.issueDate,
          "Nije još izdano"
        );


        setText(
          "certificateId",
          c.certificateId || certificateId
        );


        /*
          ----------------------------------------------------
          STATUS
          ----------------------------------------------------
        */

        const status =
          String(c.status || "PENDING")
            .trim()
            .toUpperCase();

        setText(
          "status",
          status
        );


        /*
          ----------------------------------------------------
          QR PROVJERA
          ----------------------------------------------------

          QR vodi na JAVNU stranicu za provjeru,
          a ne ponovno na certificate.html.
        */

        const verificationUrl =
          `${window.location.origin}/?id=${encodeURIComponent(
            c.certificateId || certificateId
          )}`;


        const qrContainer =
          document.getElementById("qr");


        qrContainer.innerHTML = "";


        if (typeof QRCode !== "undefined") {

          new QRCode(
            qrContainer,
            {
              text: verificationUrl,
              width: 180,
              height: 180,
              correctLevel: QRCode.CorrectLevel.H
            }
          );

        } else {

          qrContainer.textContent =
            "QR nije dostupan";

        }


      } catch (error) {

        console.error(
          "ALIMDAR certificate error:",
          error
        );

        certificate.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "Certifikat trenutačno nije moguće učitati.";
      }
    }


    loadCertificate();

  </script>

</body>
</html>
